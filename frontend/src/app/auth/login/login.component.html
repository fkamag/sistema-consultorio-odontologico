<div class="login-page">

  <div class="login-decor login-decor-1">
    <svg viewBox="0 0 200 260" aria-hidden="true">
      <path d="M62,70 C58,50 65,32 82,30 C88,20 100,20 106,30 C123,32 130,50 126,70 C132,78 130,90 122,95 L112,97 L100,100 L88,97 L78,95 C70,90 68,78 62,70 Z" fill="var(--color-teal)"/>
      <path d="M82,96 C78,122 76,152 74,182 C73,202 76,216 80,223 C84,227 88,220 89,206 C91,176 92,142 90,112 C89,102 86,97 82,96 Z" fill="var(--color-teal)"/>
      <path d="M118,96 C122,122 124,152 126,182 C127,202 124,216 120,223 C116,227 112,220 111,206 C109,176 108,142 110,112 C111,102 114,97 118,96 Z" fill="var(--color-teal)"/>
    </svg>
  </div>

  <div class="login-decor login-decor-2">
    <svg viewBox="0 0 200 260" aria-hidden="true">
      <path d="M62,70 C58,50 65,32 82,30 C88,20 100,20 106,30 C123,32 130,50 126,70 C132,78 130,90 122,95 L112,97 L100,100 L88,97 L78,95 C70,90 68,78 62,70 Z" fill="var(--color-teal)"/>
      <path d="M82,96 C78,122 76,152 74,182 C73,202 76,216 80,223 C84,227 88,220 89,206 C91,176 92,142 90,112 C89,102 86,97 82,96 Z" fill="var(--color-teal)"/>
      <path d="M118,96 C122,122 124,152 126,182 C127,202 124,216 120,223 C116,227 112,220 111,206 C109,176 108,142 110,112 C111,102 114,97 118,96 Z" fill="var(--color-teal)"/>
    </svg>
  </div>

  <div class="login-inner">

    <div class="brand">
      Consultório <span class="sub">SISTEMA</span>
    </div>

    <div class="modal">
      <h2>Entrar</h2>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">

        <div class="field">
          <label for="email">E-mail</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="username"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
          >
        </div>

        <div class="field">
          <label for="password">Senha</label>
          <div class="password-wrap">
            <input
              id="password"
              [type]="hidePassword ? 'password' : 'text'"
              formControlName="password"
              autocomplete="current-password"
            >
            <button
              type="button"
              class="password-toggle"
              tabindex="-1"
              (click)="hidePassword = !hidePassword"
            >
              <svg *ngIf="hidePassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="!hidePassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M3 3l18 18"/>
                <path d="M10.6 5.4A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a15.6 15.6 0 0 1-3.2 4.1M6.5 6.6C4 8.3 2 12 2 12s3.5 7 10 7c1.4 0 2.6-.3 3.7-.8"/>
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="alert-strip" *ngIf="errorMsg">{{ errorMsg }}</div>

        <button type="submit" class="btn" style="width:100%;" [disabled]="loading">
          <span *ngIf="!loading">Entrar</span>
          <span *ngIf="loading">Aguarde…</span>
        </button>

      </form>
    </div>

  </div>
</div>
