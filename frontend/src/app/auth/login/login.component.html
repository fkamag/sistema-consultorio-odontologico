<div class="login-container">
  <mat-card class="login-card">

    <div class="login-header">
      <h1 class="login-title">Consultório Odontológico</h1>
      <p class="login-subtitle">Acesso ao sistema de gestão</p>
    </div>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email">
          <mat-icon matSuffix>email</mat-icon>
          <mat-error *ngIf="form.get('email')?.hasError('required')">Email é obrigatório</mat-error>
          <mat-error *ngIf="form.get('email')?.hasError('email')">Email inválido</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Senha</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" autocomplete="current-password">
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="form.get('password')?.hasError('required')">Senha é obrigatória</mat-error>
        </mat-form-field>

        <div *ngIf="errorMessage" class="login-error">
          {{ errorMessage }}
        </div>

        <button mat-raised-button color="primary" type="submit" class="full-width login-btn"
                [disabled]="loading">
          <mat-spinner *ngIf="loading" diameter="18"></mat-spinner>
          <span *ngIf="!loading">Entrar</span>
        </button>

      </form>
    </mat-card-content>

  </mat-card>
</div>
