<h2>{{ orcamento ? 'Editar orçamento' : 'Novo orçamento' }}</h2>

<form [formGroup]="form" (ngSubmit)="salvar()">

  <ng-container *ngIf="!orcamento">
    <div class="field">
      <label>Paciente</label>
      <div class="combo-busca" *ngIf="!pacienteFixo">
        <input
          type="text"
          formControlName="pacienteBusca"
          placeholder="Digite o nome do paciente..."
          autocomplete="off"
          (input)="buscarPaciente($any($event.target).value)"
        />
        <div class="combo-dropdown" *ngIf="showPacienteDropdown && pacientes.length > 0">
          <div
            class="combo-option"
            *ngFor="let p of pacientes"
            (click)="selecionarPaciente(p)"
          >{{ p.name }}</div>
        </div>
      </div>
      <div class="field-value" *ngIf="pacienteFixo">{{ pacienteFixo.name }}</div>
      <div class="field-hint" *ngIf="pacienteSelecionado && !pacienteFixo">
        Selecionado: <strong>{{ pacienteSelecionado.name }}</strong>
      </div>
    </div>
  </ng-container>

  <div class="field">
    <label>Itens / procedimentos</label>
    <textarea
      formControlName="descricaoItens"
      rows="5"
      placeholder="ex: obturação dente 23, canal dente 34, limpeza..."
    ></textarea>
    <div class="field-error" *ngIf="form.get('descricaoItens')?.invalid && form.get('descricaoItens')?.touched">
      Campo obrigatório.
    </div>
  </div>

  <div class="field-row">
    <div class="field">
      <label>Valor total (R$)</label>
      <input type="number" step="0.01" min="0" formControlName="totalValue" placeholder="0,00" />
      <div class="field-error" *ngIf="form.get('totalValue')?.invalid && form.get('totalValue')?.touched">
        Informe um valor válido.
      </div>
    </div>
    <div class="field">
      <label>Validade</label>
      <input type="date" formControlName="validUntil" />
    </div>
  </div>

  <ng-container *ngIf="orcamento">
    <div class="info-grid">
      <div class="info-card">
        <div class="label">Pago até agora</div>
        <div class="value mono">{{ formatBRL(orcamento.totalPago) }}</div>
      </div>
      <div class="info-card">
        <div class="label">Saldo restante</div>
        <div class="value mono">{{ formatBRL(orcamento.saldo) }}</div>
      </div>
    </div>
  </ng-container>

  <div class="field-row">
    <div class="field">
      <label>Status do orçamento</label>
      <select formControlName="status">
        <option *ngFor="let s of statusOpcoes" [value]="s">{{ statusLabels[s] }}</option>
      </select>
    </div>
    <div class="field">
      <label>Status do tratamento</label>
      <select formControlName="statusTratamento">
        <option *ngFor="let s of tratamentoOpcoes" [value]="s">{{ tratamentoLabels[s] }}</option>
      </select>
    </div>
  </div>

  <div class="field">
    <label>Situação do saldo</label>
    <select formControlName="situacaoSaldo">
      <option value="">—</option>
      <option value="Não finalizou o tratamento">Não finalizou o tratamento</option>
      <option value="Valor não pago">Valor não pago</option>
    </select>
  </div>

  <div class="field-row">
    <div class="field">
      <label>Declaração no IR</label>
      <select formControlName="declaracaoIr">
        <option value="Em branco">Em branco</option>
        <option value="Declarado no IR">Declarado no IR</option>
      </select>
    </div>
    <div class="field">
      <label>Data da declaração</label>
      <input type="date" formControlName="dataDeclaracao" />
    </div>
  </div>

  <div class="modal-actions">
    <button type="button" class="btn quiet" (click)="cancel.emit()">Cancelar</button>
    <button type="submit" class="btn" [disabled]="loading">
      {{ orcamento ? 'Salvar' : 'Criar orçamento' }}
    </button>
  </div>

</form>
