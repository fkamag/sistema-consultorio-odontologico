<div id="shell">

  <!-- SIDEBAR desktop -->
  <nav id="sidebar">

    <div class="brand">
      Consultório<span class="sub">SISTEMA</span>
    </div>

    <ng-container *ngFor="let group of visibleGroups()">
      <div class="nav-group-label">{{ group.group }}</div>
      <button
        *ngFor="let item of group.items"
        class="nav-item"
        [class.active]="isActive(item)"
        [routerLink]="item.route"
      >
        <span class="nav-icon" [innerHTML]="icons[item.icon]"></span>
        {{ item.label }}
      </button>
    </ng-container>

    <div class="sidebar-foot">
      <div class="scope-note" *ngIf="user">{{ user.name }}</div>
      <div class="role-label">Perfil</div>
      <div class="role-value">{{ user?.role | roleLabel }}</div>
      <button class="ghost-link logout-btn" (click)="logout()">Sair</button>
    </div>

  </nav>

  <!-- MOBILE top bar -->
  <div id="mobiletopbar">
    <div class="brand">Consultório</div>
    <button class="icon-btn" (click)="mobileMenuOpen = !mobileMenuOpen" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
        <path d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
  </div>

  <!-- MAIN content -->
  <main id="main">
    <router-outlet></router-outlet>
  </main>

</div>

<!-- MOBILE BOTTOM NAV -->
<nav id="bottomnav">
  <button
    *ngFor="let item of mobileNavItems"
    [class.active]="isActive(item)"
    [routerLink]="item.route"
  >
    <span [innerHTML]="icons[item.icon]"></span>
    <span>{{ item.label }}</span>
  </button>
</nav>

<!-- MOBILE MENU OVERLAY -->
<div *ngIf="mobileMenuOpen" class="mobile-menu-overlay" (click)="mobileMenuOpen = false">
  <div class="mobile-menu-sheet" (click)="$event.stopPropagation()">
    <ng-container *ngFor="let group of visibleGroups()">
      <div class="nav-group-label">{{ group.group }}</div>
      <button
        *ngFor="let item of group.items"
        class="nav-item"
        [class.active]="isActive(item)"
        [routerLink]="item.route"
        (click)="mobileMenuOpen = false"
      >
        <span class="nav-icon" [innerHTML]="icons[item.icon]"></span>
        {{ item.label }}
      </button>
    </ng-container>
    <div class="sidebar-foot">
      <button class="ghost-link logout-btn" (click)="logout()">Sair</button>
    </div>
  </div>
</div>
