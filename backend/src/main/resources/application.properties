spring.application.name=consultorio-api

# Datasource (valores sobrescritos pelo docker-compose via variáveis de ambiente)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5441/consultorio}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:consultorio_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:troque_esta_senha}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=${JWT_SECRET:dev_secret_key_minimo_256_bits_para_ambiente_local_apenas}
app.jwt.access-token-expiration-minutes=${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:60}
app.jwt.refresh-token-expiration-days=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:30}
