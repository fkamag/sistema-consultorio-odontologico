name: CI — Testes e Build

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  test-backend:
    name: Backend — Testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: consultorio_test
          POSTGRES_USER: consultorio
          POSTGRES_PASSWORD: consultorio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Executar testes
        working-directory: ./backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/consultorio_test
          SPRING_DATASOURCE_USERNAME: consultorio
          SPRING_DATASOURCE_PASSWORD: consultorio_test
          JWT_SECRET: ci-secret-key-for-testing-only-32chars
          JWT_ACCESS_TOKEN_EXPIRATION_MINUTES: 60
          JWT_REFRESH_TOKEN_EXPIRATION_DAYS: 30
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_BUCKET: consultorio
        run: ./mvnw test -q

  build-frontend:
    name: Frontend — Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: ./frontend
        run: npm ci

      - name: Build de produção
        working-directory: ./frontend
        run: npm run build
