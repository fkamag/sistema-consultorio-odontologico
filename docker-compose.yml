name: consultorio-odontologico

services:

  db:
    image: postgres:16-alpine
    container_name: consultorio_db
    env_file: ./backend/.env
    ports:
      - "${DB_PORT:-5441}:5432"
    volumes:
      - consultorio_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: consultorio_api
    env_file: ./backend/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-consultorio}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-consultorio_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-troque_esta_senha}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: consultorio_frontend
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  consultorio_db_data:
